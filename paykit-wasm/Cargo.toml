[package]
name = "paykit-wasm"
version = "0.1.0-rc44"
authors = ["johnc@synonym.to"]
description = "Browser WASM binding for Paykit Encrypted Links and Payment Endpoints"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
paykit-lib = { path = "../paykit-lib", version = "0.1.0-rc43" }
pubky = "0.8.0"
# Pinned to the exact version pubky 0.8.0 depends on so `SessionInfo` /
# `Capability` are the same types (cargo unifies them); used by
# `resumeSessionFromCookie` to synthesize the revalidation payload.
pubky-common = "0.8.0"
# SB2 / X25519 primitives for the Hypercolor handoff path. crates.io
# pubky-noise 0.1.0-rc5 does not re-export sealed_blob; default features
# only (secure-mem/region is native mlock and breaks wasm32).
pubky-crypto = { git = "https://github.com/BitcoinErrorLog/pubky-crypto.git", rev = "01eb3e6575cf8c707ad0675962581e13aa4da0f0" }
pubky-noise = "0.1.0-rc5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom is not used directly; these declarations exist to switch the
# transitive getrandom crates in the dependency graph to their JS entropy
# backends (crypto.getRandomValues) when compiling for wasm32:
# - getrandom 0.3 (pubky-noise, snow, rand 0.9) needs the `wasm_js` feature
#   plus the `getrandom_backend="wasm_js"` cfg set in ../.cargo/config.toml.
# - getrandom 0.2 (pkarr/ntimestamp, flume/nanorand, rand 0.8-era crates)
#   needs the `js` feature.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# uuid (paykit-lib event ids) needs an explicit RNG source on wasm32.
uuid = { version = "1", features = ["js"] }
# pubky 0.8.0's event_stream calls Response::bytes_stream(), which reqwest
# only provides with its `stream` feature; pubky's own wasm32 dependency
# declaration omits it. Feature unification turns it on for the whole graph.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }

[dev-dependencies]
ed25519-dalek = "2"
