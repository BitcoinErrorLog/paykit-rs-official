[target.armv7-linux-androideabi]
rustflags = [
    "-C", "link-arg=-Wl,--allow-multiple-definition",
    "-C", "link-arg=-Wl,--build-id=sha1",
    "-C", "link-arg=-Wl,-z,max-page-size=16384,-z,common-page-size=16384",
]

[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,--allow-multiple-definition",
    "-C", "link-arg=-Wl,--build-id=sha1",
    "-C", "link-arg=-Wl,-z,max-page-size=16384,-z,common-page-size=16384",
]

[target.i686-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,--allow-multiple-definition",
    "-C", "link-arg=-Wl,--build-id=sha1",
    "-C", "link-arg=-Wl,-z,max-page-size=16384,-z,common-page-size=16384",
]

[target.x86_64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,--allow-multiple-definition",
    "-C", "link-arg=-Wl,--build-id=sha1",
    "-C", "link-arg=-Wl,-z,max-page-size=16384,-z,common-page-size=16384",
]

# getrandom 0.3 selects its WASM entropy backend at compile time via this cfg.
# It only applies to wasm32-unknown-unknown builds (the paykit-wasm binding);
# native builds are unaffected. See paykit-wasm/README.md.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
